name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手動觸發(Actions 頁面 Run workflow;deploy step 只認 push,手動跑僅驗證)
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # secrets context 不能用在任何 if 表達式;先在 env 求值成 "true"/"false"
      CF_DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # 依 package.json 的 packageManager 欄位安裝對應版本的 pnpm
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (lint + typecheck + test)
        run: pnpm verify

      - name: Build (static export)
        run: pnpm build

      # CD:main push 且 secrets 已設定才部署(缺 secrets 時跳過,CI 保持綠燈)。
      - name: Deploy to Cloudflare Pages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CF_DEPLOY_ENABLED == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=minna-pwa --branch=main
          # action 預設依 lockfile 選 pnpm 自我安裝 wrangler,會被 pnpm 10 的
          # build-scripts 封鎖(approve-builds)擋下;改用 npm 安裝
          packageManager: npm
